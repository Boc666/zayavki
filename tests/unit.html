<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Тестове — Заявки</title>
<style>
/* Проста страница с резултати: зелено мина, червено не мина. */
:root{--bg:#f6f5f2;--ink:#1f1d1a;--muted:#6b665e;--ok:#2f6b2a;--ok-bg:#e7f1e3;--bad:#9a2f1c;--bad-bg:#fbe9e4;--line:#e2ded6}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--ink:#ece8e1;--muted:#a59e93;--ok:#a6d995;--ok-bg:#1e2c1b;--bad:#f2a68e;--bad-bg:#3a1f17;--line:#36322c}}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}.muted{color:var(--muted)}
#sum{margin:12px 0;padding:10px 14px;border-radius:10px;font-weight:600}
#sum.ok{background:var(--ok-bg);color:var(--ok)}#sum.bad{background:var(--bad-bg);color:var(--bad)}
.g{margin:16px 0 6px;font-weight:600}
.t{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}.t b{width:18px;flex:none}
.t.ok b{color:var(--ok)}.t.bad b{color:var(--bad)}.t small{color:var(--muted);display:block}
iframe{position:absolute;left:-10000px;top:0;width:1200px;height:900px;border:0}
</style>
</head>
<body>
<h1>Автоматични тестове</h1>
<p class="muted">Зарежда програмата (../index.html) в скрита рамка и проверява сметките, датите, сливането на настройки, търсенето и дали печатните листове се събират на A4. Не пише нищо в базата.</p>
<div id="sum">Зареждане…</div>
<div id="out"></div>
<iframe id="app"></iframe>
<script>
const out=document.getElementById("out"),results=[];let group="";
const show=()=>{const bad=results.filter(r=>!r.ok).length,s=document.getElementById("sum");
  s.className=bad?"bad":"ok";s.textContent=bad?`Не минаха ${bad} от ${results.length} теста`:`Всички ${results.length} теста минаха ✔`;
  document.title=(bad?"✗ ":"✔ ")+"Тестове — Заявки";window.TEST_RESULT={total:results.length,failed:bad,fails:results.filter(r=>!r.ok)}};
function G(name){group=name;out.insertAdjacentHTML("beforeend",`<div class="g">${name}</div>`)}
function T(name,fn){let ok=false,info="";try{const r=fn();ok=r===true||(r&&r.ok===true);if(!ok)info=r&&r.info!==undefined?r.info:JSON.stringify(r)}catch(e){info="грешка: "+e.message}
  results.push({group,name,ok,info});
  out.insertAdjacentHTML("beforeend",`<div class="t ${ok?"ok":"bad"}"><b>${ok?"✔":"✗"}</b><div>${name.replace(/</g,"&lt;")}${ok?"":`<small>${String(info).replace(/</g,"&lt;")}</small>`}</div></div>`)}
const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b)?true:{info:`очаквано ${JSON.stringify(b)}, получено ${JSON.stringify(a)}`};
const near=(a,b,d=0.005)=>Math.abs(a-b)<=d?true:{info:`очаквано ${b}, получено ${a}`};

document.getElementById("app").onload=()=>setTimeout(run,600);
document.getElementById("app").src="../index.html?unittest="+Date.now(); // винаги най-новата версия (без кеш)
function run(){
  const W=document.getElementById("app").contentWindow,E=c=>W.eval(c);
  // чисто начало: настройки и каталог по подразбиране (без база)
  E(`SETTINGS=migrateSettings(null);CATALOG=migrateCatalog(null);TEMPLATE=defaultTemplate();SETTINGS.digits=3;SETTINGS.invVatRate=20;`);

  G("Сметки по заявката");
  T("услуги + организация + лекар − отстъпка − плащания (със сторно)",()=>{const c=E(`(()=>{const r=newRequest();r.orgFee=200;r.doctorOn=true;r.doctorFee=50;
      const l=r.lines.find(x=>x.no===1);Object.assign(l,{used:true,qty:2,price:100.10});r.discountPct=10;
      r.payments=[{type:"payment",amount:100},{type:"refund",amount:20}];return calc(r)})()`);
    return [near(c.services,200.2),near(c.fees,250),near(c.sub,450.2),near(c.discount,45.02),near(c.total,405.18),near(c.advance,80),near(c.rest,325.18)].find(x=>x!==true)||true});
  T("лекар без отметка не се брои",()=>near(E(`(()=>{const r=newRequest();r.orgFee=100;r.doctorOn=false;r.doctorFee=50;return calc(r).total})()`),100));
  T("стар запис: аванс без история",()=>near(E(`(()=>{const r=newRequest();r.orgFee=300;r.advance=120;return calc(r).rest})()`),180));
  T("стар запис: „платена изцяло“ → остатък 0",()=>near(E(`(()=>{const r=newRequest();r.orgFee=300;r.paid=true;return calc(r).rest})()`),0));
  T("отстъпка над 100 % се ограничава до 100",()=>near(E(`(()=>{const r=newRequest();r.orgFee=300;r.discountPct=150;return calc(r).total})()`),0));
  T("закръгляне на стотинки (0,1 + 0,2)",()=>near(E(`(()=>{const r=newRequest();const l=r.lines.find(x=>x.no===1);Object.assign(l,{used:true,qty:1,price:0.1});
      const l2=r.lines.find(x=>x.no===2);Object.assign(l2,{used:true,qty:1,price:0.2});return calc(r).total})()`),0.3,0));
  T("редовете на офертата дават сумата преди отстъпка",()=>{const v=E(`(()=>{const r=sampleRequests()[0];return {rows:offerRows(r).reduce((s,x)=>s+x.amt,0),sub:calc(r).sub}})()`);return near(v.rows,v.sub,0.011)});

  G("Фактура");
  T("ДДС 20 % се отделя от крайната сума",()=>{const c=E(`(()=>{const r=newRequest();r.inv=Object.assign(emptyInv(),{amount:1200,vat:true});return invCalc(r)})()`);return [near(c.base,1000),near(c.vat,200),near(c.total,1200)].find(x=>x!==true)||true});
  T("без ДДС: основата е цялата сума",()=>{const c=E(`(()=>{const r=newRequest();r.inv=Object.assign(emptyInv(),{amount:999.99,vat:false});return invCalc(r)})()`);return [near(c.base,999.99),near(c.vat,0)].find(x=>x!==true)||true});
  T("сума с думи",()=>{const w=E(`amountWords(1250.5)`);return /хиляда двеста и петдесет/.test(w)&&/50 цента/.test(w)?true:{info:w}});

  G("Дати, ЕГН, номера");
  T("ЕГН → дата на раждане (1942)",()=>eq(E(`egnBirth("4203124519")`),"1942-03-12"));
  T("ЕГН → дата на раждане (след 2000)",()=>eq(E(`egnBirth("0552151232")`),"2005-12-15"));
  T("невалидно ЕГН → нищо",()=>eq(E(`egnBirth("4203124518")`),null));
  T("40 дни: денят на смъртта е първи (08.10 → 16.11)",()=>eq(E(`isoOf(d40add(new Date(2026,9,8),39))`),"2026-11-16"));
  T("6 месеца от 31 август → 28 февруари",()=>eq(E(`isoOf(d40add(new Date(2026,7,31),0,6))`),"2027-02-28"));
  T("номер с водещи нули",()=>eq(E(`padNo(7)`),"007"));

  G("Телефони и търсене");
  T("няколко телефона в едно поле",()=>eq(E(`phoneKeys("0888 123 456, 02/987 65 43")`),["359888123456","35929876543"]));
  T("два мобилни номера с наклонена черта",()=>eq(E(`phoneKeys("0888 111 222 / 0899 333 444")`),["359888111222","359899333444"]));
  T("търсене по телефон в различен запис",()=>eq(E(`gsMatch("0888 123",["+359 888 123 456"])`),true));
  T("търсене по части от име (без значение от регистъра)",()=>eq(E(`gsMatch("мими петр",["Мария „Мими“ Петрова"])`),true));
  T("търсене: несъвпадение",()=>eq(E(`gsMatch("иван",["Петър Петров"])`),false));

  G("Сливане на настройки (двама записват едновременно)");
  T("моята промяна + тяхната промяна — и двете остават",()=>eq(E(`(()=>{const base={a:1,items:[{p:1,n:"x"},{p:2,n:"y"}]};
      const mine=structuredClone(base);mine.items[1].n="z";const theirs=structuredClone(base);theirs.items[0].p=9;theirs.a=5;
      return applyPaths(structuredClone(theirs),diffPaths(base,mine))})()`),{a:5,items:[{p:9,n:"x"},{p:2,n:"z"}]}));
  T("изтрито поле се изтрива и при тях",()=>eq(E(`(()=>{const base={a:1,b:2};const mine={a:1};const theirs={a:3,b:2,c:4};return applyPaths(structuredClone(theirs),diffPaths(base,mine))})()`),{a:3,c:4}));
  T("без промени → нищо за прилагане",()=>eq(E(`diffPaths({a:[1,2],b:{c:1}},{a:[1,2],b:{c:1}}).length`),0));

  G("Некролози в статистиката");
  const nk=st=>E(`(()=>{const r=newRequest();r.reqDate="2026-11-03";if(${JSON.stringify(st)})r.status=${JSON.stringify(st)};const l=lineOf(r,CATALOG.lamNo);Object.assign(l,{used:true,qty:15,necType:"color"});return necroReqItem(r)})()`);
  T("приключена заявка: 15 некролога се броят",()=>{const it=nk("done");return it&&it.done===true&&it.qty===15?true:{info:JSON.stringify(it)}});
  T("незавършена заявка: некролозите чакат",()=>{const it=nk("confirmed");return it&&it.done===false?true:{info:JSON.stringify(it)}});
  T("нова заявка без статус и без плащане не се брои",()=>{const it=nk("");return it&&it.done===false?true:{info:JSON.stringify(it)}});
  T("заявка без некролози → нищо",()=>eq(E(`necroReqItem(newRequest())`),null));
  const APP_LOGO_TEST=()=>E("APP_LOGO");
  G("Лого: документи и програма поотделно");
  T("„Без лого“ в програмата не маха логото от документите",()=>{const v=E(`(()=>{const S=migrateSettings({logoMode:"custom",logo:"data:image/png;base64,eA==",sideLogoMode:"none"});return [docLogoSrc(S),sideLogoSrc(S).src]})()`);return eq(v,["data:image/png;base64,eA==",""])});
  T("„Без лого“ на документите не маха логото от програмата",()=>{const v=E(`(()=>{const S=migrateSettings({logoMode:"none",logo:"data:image/png;base64,eA==",sideLogoMode:"app"});return [docLogoSrc(S),sideLogoSrc(S).src]})()`);return eq(v,["",APP_LOGO_TEST()])});
  T("отделно изображение за програмата",()=>{const v=E(`(()=>{const S=migrateSettings({logoMode:"custom",logo:"data:image/png;base64,ZG9j",sideLogoMode:"custom",sideLogo:"data:image/png;base64,c2lkZQ=="});return [docLogoSrc(S),sideLogoSrc(S).src]})()`);return eq(v,["data:image/png;base64,ZG9j","data:image/png;base64,c2lkZQ=="])});
  T("стари настройки с лого: програмата показва същото лого",()=>{const v=E(`(()=>{const S=migrateSettings({logoMode:"custom",logo:"data:image/png;base64,eA=="});return [S.sideLogoMode,sideLogoSrc(S).src]})()`);return eq(v,["doc","data:image/png;base64,eA=="])});
  T("„Същото като на документите“ без лого → логото на програмата",()=>{const v=E(`(()=>{const S=migrateSettings({logoMode:"none",sideLogoMode:"doc"});const r=sideLogoSrc(S);return [r.app,r.src===APP_LOGO]})()`);return eq(v,[true,true])});
  G("Празна заявка не се записва");
  T("нова заявка без нищо попълнено е празна",()=>eq(E(`isBlankReq(newRequest())`),true));
  T("само име на заявител → не е празна",()=>eq(E(`(()=>{const r=newRequest();r.appName="Мария";return isBlankReq(r)})()`),false));
  T("само избрана услуга → не е празна",()=>eq(E(`(()=>{const r=newRequest();r.lines[1].used=true;return isBlankReq(r)})()`),false));
  G("Разходи на агенцията");
  const CO=(c,rg)=>E(`(()=>{COSTS=migrateCosts(${JSON.stringify(c)});return costsInRange(${JSON.stringify(rg)}).map(x=>[x.date,x.kind,x.amount])})()`);
  T("еднократен разход в периода се брои, извън периода — не",()=>eq(CO({items:[{id:"a",date:"2026-11-05",cat:"pay",amount:800},{id:"b",date:"2026-10-30",cat:"rent",amount:500}]},["2026-11-01","2026-11-30"]),[["2026-11-05","one",800]]));
  T("планов наем всеки месец на 5-о число",()=>eq(CO({plans:[{id:"p",cat:"rent",amount:500,freq:"month",day:5,start:"2026-09"}]},["2026-09-01","2026-11-30"]).map(x=>x[0]),["2026-11-05","2026-10-05","2026-09-05"]));
  T("платеният падеж заменя плановата сума (без двойно броене)",()=>eq(CO({plans:[{id:"p",cat:"rent",amount:500,freq:"month",day:5,start:"2026-11"}],items:[{id:"x",planId:"p",period:"2026-11",date:"2026-11-06",cat:"rent",amount:520}]},["2026-11-01","2026-11-30"]),[["2026-11-06","plan-paid",520]]));
  T("на 3 месеца и до краен месец",()=>eq(CO({plans:[{id:"q",cat:"tax",amount:90,freq:"quarter",day:31,start:"2026-01",end:"2026-08"}]},["2026-01-01","2026-12-31"]).map(x=>x[0]),["2026-07-31","2026-04-30","2026-01-31"]));
  T("спрян планов разход не се брои",()=>eq(CO({plans:[{id:"p",cat:"rent",amount:500,freq:"month",day:1,start:"2026-01",active:false}]},["2026-01-01","2026-12-31"]),[]));
  T("аванс на служителя не влиза в разходите",()=>{const c=E(`(()=>{const r=ensureWs(newRequest());r.ws.given=200;r.ws.other.cost=170;return wsCalc(r)})()`);return eq([c.expenses,c.given],[170,200])});
  G("Хладилна камера");
  T("дни престой между две дати",()=>eq(E(`daysBetween("2026-11-10","2026-11-18")`),8));
  T("влязъл днес = 0 дни",()=>eq(E(`daysBetween(todayISO())`),0));
  T("в камерата сега = тези без дата на излизане",()=>{const v=E(`(()=>{FRIDGE=migrateFridge({entries:[{id:"a",name:"А",dateIn:"2026-11-10"},{id:"b",name:"Б",dateIn:"2026-11-05",dateOut:"2026-11-12"}]});return frInside().map(x=>x.id)})()`);return eq(v,["a"])});
  T("migrateFridge прави празен масив и число за клетки",()=>eq(E(`(()=>{const f=migrateFridge({cells:"8"});return [Array.isArray(f.entries),f.cells]})()`),[true,8]));
  G("Самостоятелна регистрация");
  T("транслитерация на код от име на агенция",()=>eq(E(`translitCode("Погребална агенция Мир")`),"pogrebalna-agentsiya-mir"));
  T("кодът е само латиница, цифри и тире",()=>eq(E(`translitCode("  Тих Дом 2!! ")`),"tih-dom-2"));
  G("Срок за пазене на лични данни");
  T("стара заявка с ЕГН → за изтриване",()=>eq(E(`retDue(Object.assign(newRequest(),{ritDate:"2018-01-10",decEgn:"4203124519"}),5)`),true));
  T("нова заявка → не",()=>eq(E(`retDue(Object.assign(newRequest(),{ritDate:new Date().toISOString().slice(0,10),decEgn:"4203124519"}),5)`),false));
  T("примерна заявка → никога",()=>eq(E(`retDue(Object.assign(newRequest(),{sample:true,ritDate:"2010-01-01",decEgn:"4203124519"}),5)`),false));
  T("вече изчистена → не",()=>eq(E(`retDue(Object.assign(newRequest(),{ritDate:"2010-01-01"}),5)`),false));

  G("Сигурност: чужд код в шаблона или логото не се изпълнява");
  // атрибути on…=, които биха се появили при вмъкване; парсваме в <template>, без да изпълняваме нищо
  const onAttrs=()=>E(`(()=>{const t=document.createElement("template");t.innerHTML=window.__H;return [...t.content.querySelectorAll("*")].flatMap(e=>[...e.attributes].filter(a=>/^on/i.test(a.name)).map(a=>e.tagName+" "+a.name))})()`);
  const safeHtml=code=>{W.__H=E(code);const a=onAttrs();return a.length?{info:"вмъкнати: "+a.join(", ")}:true};
  const XSS=`x" autofocus onfocus="window.__pwn=1`;
  T("ключ на поле в шаблона с кавички",()=>safeHtml(`(()=>{const t=defaultTemplate();t.p1.push({t:"row",f:[{k:${JSON.stringify(XSS)},l:"А"}]});TEMPLATE=migrateTemplate(t);try{return page1(newRequest(),"edit")}finally{TEMPLATE=defaultTemplate()}})()`));
  T("ширина, тип и списък на поле в шаблона с кавички",()=>safeHtml(`(()=>{const t=defaultTemplate();t.p1.push({t:"row",f:[{k:"zz1",l:"А",w:${JSON.stringify(XSS)}},{k:"zz2",type:${JSON.stringify(XSS)}},{k:"zz3",list:${JSON.stringify(XSS)}}]});TEMPLATE=migrateTemplate(t);try{return page1(newRequest(),"edit")}finally{TEMPLATE=defaultTemplate()}})()`));
  T("лого, което не е картинка",()=>safeHtml(`(()=>{const s=SETTINGS;SETTINGS=migrateSettings({logoMode:"custom",logo:'x" onerror="window.__pwn=1'});try{return headHTML()}finally{SETTINGS=s}})()`));
  T("истинско лого (data:image) се показва",()=>{const s=E(`(()=>{const s=SETTINGS;SETTINGS=migrateSettings({logoMode:"custom",logo:"data:image/png;base64,iVBORw0KGgo="});try{return headHTML()}finally{SETTINGS=s}})()`);return s.includes('src="data:image/png;base64,iVBORw0KGgo="')?true:{info:s.slice(0,200)}});
  T("ключ с непозволени знаци отпада от шаблона",()=>eq(E(`(()=>{const t=defaultTemplate();t.p1.push({t:"row",f:[{k:${JSON.stringify(XSS)},l:"А"}]});return migrateTemplate(t).p1.flatMap(b=>b.t==="row"?b.f.map(f=>f.k):[]).some(k=>k&&!/^[A-Za-z0-9_]+$/.test(k))})()`),false));

  G("Сигурност: документите се почистват, преди да се покажат");
  const BADDOC=`{name:"д",html:'<p>Текст</p><img src="x" onerror="window.__pwn=1"><svg><a href="javascript:alert(1)"><text>x</text></a></svg><a href="javascript:alert(1)">в</a><b onclick="x()">б</b>',base:'font-size:11pt" onmouseover="window.__pwn=1',page:{w:'210mm" onx="1',h:297,t:25,r:25,b:25,l:25}}`;
  T("вмъкнат код в текста на документа отпада",()=>{W.__H=E(`safeDoc(${BADDOC}).html`);const a=onAttrs();return a.length?{info:"вмъкнати: "+a.join(", ")}:true});
  T("javascript: връзки и svg отпадат",()=>{const h=E(`safeDoc(${BADDOC}).html`);return /javascript:|<svg/i.test(h)?{info:h}:true});
  T("обикновеният текст на документа остава",()=>{const h=E(`safeDoc(${BADDOC}).html`);return h.includes("<p>Текст</p>")&&h.includes("<b>б</b>")?true:{info:h}});
  T("основният стил не може да излезе от style=\"…\"",()=>{const b=E(`safeDoc(${BADDOC}).base`);return /["<>]/.test(b)?{info:b}:true});
  T("размерите на листа са само числа",()=>{const p=E(`safeDoc(${BADDOC}).page`);return Object.values(p).every(v=>typeof v==="number"&&isFinite(v))?true:{info:JSON.stringify(p)}});
  T("документ без размери получава A4",()=>eq(E(`safeDoc({html:"",base:""}).page`),{w:210,h:297,t:25,r:25,b:25,l:25}));

  G("Склад: корекция на наличност");
  T("крайната наличност е въведената, дори друг да е изписал междувременно",()=>eq(E(`(()=>{const d=migrateInvd({items:[{id:"i1",name:"Ковчег",unit:"бр.",stock:8,avgCost:10,status:"active"}]});
      const r=adjustStockTo(d,"i1",10,"инвентаризация");return [d.items[0].stock,r.dq,r.before,d.moves.length,d.moves[0]&&d.moves[0].qty]})()`),[10,2,8,1,2]));
  T("ако наличността вече е същата, нищо не се записва",()=>eq(E(`(()=>{const d=migrateInvd({items:[{id:"i1",name:"Ковчег",unit:"бр.",stock:10,avgCost:10,status:"active"}]});
      const r=adjustStockTo(d,"i1",10,"x");return [r.dq,d.moves.length]})()`),[0,0]));

  G("История: кой и кога според сървъра");
  T("показва потребителя, записан от сървъра, а не написаното от браузъра",()=>eq(E(`(()=>{const o=USERS;USERS=[{id:"u1",name:"Иван"}];try{return auditWho({user:"Мария",serverUid:"u1"})}finally{USERS=o}})()`),"Иван"));
  T("стар запис без сървърни данни: показва записаното",()=>eq(E(`(()=>{const o=USERS;USERS=[];try{return auditWho({user:"Мария"})}finally{USERS=o}})()`),"Мария"));
  T("часът е от сървъра, когато го има",()=>eq(E(`auditTime({ts:"2020-01-01T00:00:00Z",serverTs:"2026-05-05T10:00:00Z"}).toISOString()`),"2026-05-05T10:00:00.000Z"));

  G("Склад: две продажни цени");
  T("стоковата разписка взима цената за разписки, ако е въведена",()=>eq(E(`[srUnitPrice({salePrice:100,srPrice:80}),srUnitPrice({salePrice:100,srPrice:null}),srUnitPrice({salePrice:null})]`),[80,100,null]));
  T("старите артикули получават празна цена за разписки",()=>eq(E(`migrateInvd({items:[{id:"i1",name:"Ковчег",salePrice:100}],moves:[]}).items[0].srPrice`),null));

  G("Фактура към стокова разписка");
  const SRX=`{id:"s1",number:"7",date:"2026-11-20",buyerName:"Иван Петров",lines:[{name:"Ковчег",item:"izt",qty:2,price:300},{name:"Венец",price:45},{name:"  ",price:null}]}`;
  T("перата идват от разписката: име, количество и единична цена",()=>eq(E(`srInvFrom(${SRX}).lines.map(l=>[l.name,l.qty,l.price])`),[["Ковчег",2,150],["Венец",1,45]]));
  T("получателят и датата на данъчното събитие са от разписката",()=>eq(E(`(()=>{const I=srInvFrom(${SRX});return [I.buyerName,I.taxDate,I.buyerType]})()`),["Иван Петров","2026-11-20","person"]));
  T("сумата е сборът от перата; с ДДС се разделя на основа и данък",()=>eq(E(`(()=>{const I=srInvFrom(${SRX});I.vat=false;const a=invCalc({inv:I});I.vat=true;const b=invCalc({inv:I});return [a.total,a.base,b.total,b.base,b.vat]})()`),[345,345,345,287.5,57.5]));
  T("печатът показва всяко перо и общата сума",()=>{const h=E(`(()=>{const I=srInvFrom(${SRX});I.vat=false;I.number="0000000009";return buildInvPrint({inv:I})})()`);
    return /Ковчег/.test(h)&&/Венец/.test(h)&&/345,00/.test(h)&&/0000000009/.test(h)?true:{info:h.replace(/<[^>]+>/g," ").replace(/\s+/g," ").slice(0,300)}});
  T("старата фактура към заявка печата както досега един ред",()=>{const h=E(`(()=>{const r=sampleRequests()[0];r.inv=Object.assign(emptyInv(),{desc:"Погребални услуги",amount:500});return buildInvPrint(r)})()`);
    return /Погребални услуги/.test(h)&&/500,00/.test(h)?true:{info:"няма реда"}});
  T("един номер не може да е и на заявка, и на разписка",()=>eq(E(`(()=>{const R=[{id:"r1",number:"3",inv:{number:"0000000005"}}],S=[{id:"s1",number:"7",inv:{number:"0000000006"}}];
      return [invNoUsed("0000000005",R,S,"s1"),invNoUsed("0000000006",R,S,"r1"),invNoUsed("0000000006",R,S,"s1"),invNoUsed("0000000007",R,S,"s1")]})()`),["заявка № 3","стокова разписка № 7",null,null]));

  G("Помощ: ръководство");
  T("всяка тема има заглавие и поне един въпрос с отговор",()=>eq(E(`HELP.filter(t=>!t.t||!t.q.length||t.q.some(x=>!x[0]||!x[1])).map(t=>t.id)`),[]));
  T("темите сочат към истински раздели от менюто",()=>eq(E(`HELP.filter(t=>t.tab&&!document.querySelector('nav.tabs button[data-tab="'+t.tab+'"]')).map(t=>t.id)`),[]));
  T("всеки раздел от менюто има тема",()=>eq(E(`[...document.querySelectorAll("nav.tabs button")].map(b=>b.dataset.tab).filter(n=>!HELP.some(t=>t.tab===n))`),[]));
  T("служител вижда само темите за своите раздели",()=>eq(E(`(()=>{const o=ME;ME={role:"user",perms:{req:"edit"}};try{const l=helpTopics().map(t=>t.id);return [l.includes("list"),l.includes("users"),l.includes("fin")]}finally{ME=o}})()`),[true,false,false]));
  T("търсенето намира по дума от отговора, без значение от главни букви",()=>{const r=E(`(()=>{const o=ME;ME={role:"admin"};try{return helpSearch("СТОРНО").map(x=>x.topic.id)}finally{ME=o}})()`);return r.includes("pay")?true:{info:r.join()}});
  T("търсенето не показва теми без достъп",()=>eq(E(`(()=>{const o=ME;ME={role:"user",perms:{}};try{return helpSearch("сторно").length}finally{ME=o}})()`),0));

  G("Печат: всеки лист се събира на една страница A4");
  // мери като при печат: смалява дългите текстове (както печатът) и проверява, че нищо не е отрязано и листът е A4
  const measure=code=>E(`(()=>{const box=document.createElement("div");box.style.cssText="position:absolute;left:-5000px;top:0";
      box.innerHTML=${code};document.body.appendChild(box);const mm=96/25.4;const left=fitPrintText(box);
      const r={sheets:[...box.querySelectorAll(".sheet")].map(s=>{const sb=s.getBoundingClientRect();let maxB=0;s.querySelectorAll("*").forEach(e=>{const q=e.getBoundingClientRect();if(q.height)maxB=Math.max(maxB,q.bottom)});
        return {h:Math.round(s.offsetHeight/mm),w:Math.round(s.offsetWidth/mm),over:Math.round((maxB-sb.bottom)/mm)}}),
        clipped:left.map(e=>(e.className||e.tagName)+": "+e.textContent.trim().slice(0,30))};box.remove();return r})()`);
  const fit=(label,code)=>T(label,()=>{const v=measure(code);if(!v.sheets.length)return {info:"няма лист"};
    const bad=v.sheets.find(s=>s.h>298||s.w>211||s.over>0);if(bad)return {info:"лист "+JSON.stringify(bad)+" (макс. 210×297 мм, съдържанието да не излиза)"};
    return v.clipped.length?{info:"отрязан текст: "+v.clipped.join(" | ")}:true});
  fit("заявка — страница 1 (примерна заявка)",`page1(sampleRequests()[0],"print")`);
  fit("заявка — страница 2 (примерна заявка)",`page2(sampleRequests()[0],"print")`);
  fit("работен лист",`buildWsPrint((()=>{const r=sampleRequests()[0];ensureWs(r);return r})())`);
  fit("фактура",`buildInvPrint((()=>{const r=sampleRequests()[0];r.inv=Object.assign(emptyInv(),r.inv||{},{number:"0000000001",date:"2026-10-22",buyerName:"Тестов Примеров Измислев",desc:"Организация на погребение"});return r})())`);
  fit("оферта",`buildOfferPrint(sampleRequests()[0])`);
  fit("заявка с много дълги имена и бележка от няколко реда",`page1(Object.assign(sampleRequests()[0],{appName:"Генерал-лейтенант о.з. Христо Тодоров Христов-Бояджиев-Николаев-Стоянов",decName:"Анастасия Христова Тодорова-Бояджиева-Лазарова-Попова",notes:"Близките молят за кратка панихида в 11 ч. и венец от семейството. ".repeat(3)}),"print")`);
  T("прекалено дълга бележка: печатът предупреждава (не отрязва безшумно)",()=>{const v=measure(`page1(Object.assign(sampleRequests()[0],{notes:"Много дълга бележка. ".repeat(60)}),"print")`);return v.clipped.length>0?true:{info:"не е отчетено отрязване"}});

  ownerTabs().then(helpSendTests).then(show);
}
// асинхронни тестове: мрежата е подменена (нищо не излиза навън)
async function TA(name,fn){let ok=false,info="";try{const r=await fn();ok=r===true;if(!ok)info=r&&r.info!==undefined?r.info:JSON.stringify(r)}catch(e){info="грешка: "+e.message}
  results.push({group,name,ok,info});
  out.insertAdjacentHTML("beforeend",`<div class="t ${ok?"ok":"bad"}"><b>${ok?"✔":"✗"}</b><div>${name.replace(/</g,"&lt;")}${ok?"":`<small>${String(info).replace(/</g,"&lt;")}</small>`}</div></div>`)}
async function helpSendTests(){
  const W=document.getElementById("app").contentWindow,E=c=>W.eval(c),orig=W.fetch;let sent=[],reply;
  W.fetch=async(url,o={})=>{sent.push({url:String(url),body:JSON.parse(o.body||"{}")});return reply()};
  const ok=()=>new Response('"x"',{status:200,headers:{"Content-Type":"application/json"}});
  const er=(st,m)=>()=>new Response(JSON.stringify({message:m,code:"P0001"}),{status:st,headers:{"Content-Type":"application/json"}});
  E(`SBS={access:"t",refresh:"r",exp:Date.now()+3600e3,uid:"u"};AG={id:"A",code:"A",name:"Агенция A"}`);
  G("Помощ: запитване");
  const send=d=>E(`helpSend(${JSON.stringify(d)})`),D={id:"11111111-1111-4111-8111-111111111111",topic:"Проблем",text:"Не печата",phone:"0888 123 456"};
  const fails=async d=>{try{await send(d);return ""}catch(e){return e.message}};
  try{
    await TA("изпраща вида, текста и телефона до сървъра",async()=>{sent=[];reply=ok;await send(D);const c=sent[0];
      return eq([sent.length,/rpc\/help_request$/.test(c.url),c.body.p_id,c.body.p_topic,c.body.p_text,c.body.p_phone],[1,true,D.id,"Проблем","Не печата","0888 123 456"])});
    await TA("празно съобщение не се изпраща",async()=>{sent=[];reply=ok;const m=await fails({...D,text:"   "});return sent.length===0&&/Напишете/.test(m)?true:{info:m}});
    await TA("без телефон не се изпраща",async()=>{sent=[];reply=ok;const m=await fails({...D,phone:"12"});return sent.length===0&&/телефон/i.test(m)?true:{info:m}});
    await TA("над 1500 знака не се изпраща",async()=>{sent=[];reply=ok;const m=await fails({...D,text:"я".repeat(1501)});return sent.length===0&&/1500/.test(m)?true:{info:m}});
    await TA("базата още няма функцията: ясно съобщение с телефон",async()=>{reply=er(404,"Could not find the function public.help_request");const m=await fails(D);return /\+359/.test(m)&&!/function/.test(m)?true:{info:m}});
    await TA("съобщението за лимит от сървъра стига до потребителя",async()=>{reply=er(400,"Изпратихте много съобщения.");const m=await fails(D);return /много съобщения/.test(m)?true:{info:m}});
  }finally{W.fetch=orig;E(`SBS=null;AG=null`)}
}
async function ownerTabs(){
  const W=document.getElementById("app").contentWindow,E=c=>W.eval(c),orig=W.fetch,calls=[];let acting="A";
  W.fetch=async(url,o={})=>{calls.push((o.method||"GET")+" "+String(url).replace(/^https?:\/\/[^/]+/,""));
    const body=/rpc\/my_context/.test(url)?{kind:"platform",name:"Собственик",acting:{agency_id:acting,code:acting,agency_name:"Агенция "+acting}}:[];
    return new Response(JSON.stringify(body),{status:200,headers:{"Content-Type":"application/json"}})};
  W.confirm=()=>false; // без прозорци по време на теста
  E(`SBS={access:"t",refresh:"r",exp:Date.now()+3600e3,uid:"u"};AG={id:"A",code:"A",name:"Агенция A",owner:true}`);
  G("Собственик с два раздела (таба): записът не отива в чужда агенция");
  try{
    await TA("същата агенция: записът минава",async()=>{calls.length=0;acting="A";await E(`sb("/rest/v1/records",{method:"POST",body:{}})`);
      return calls.some(c=>c==="POST /rest/v1/records")?true:{info:calls.join(" | ")}});
    await TA("в друг раздел е отворена друга агенция: записът спира",async()=>{calls.length=0;acting="B";E(`OWN_CHK=0`);let err="";
      try{await E(`sb("/rest/v1/records",{method:"POST",body:{}})`)}catch(e){err=e.message}
      return !calls.some(c=>c==="POST /rest/v1/records")&&/друг/.test(err)?true:{info:"грешка: "+err+" / заявки: "+calls.join(" | ")}});
    await TA("четенето не се спира (без излишни проверки)",async()=>{calls.length=0;acting="B";await E(`sb("/rest/v1/records?store=eq.x")`);
      return calls.length===1?true:{info:calls.join(" | ")}});
    await TA("„Обратно към панела“ работи и от стария раздел",async()=>{calls.length=0;acting="B";E(`OWN_CHK=0`);await E(`rpc("platform_leave_agency")`);
      return calls.some(c=>/platform_leave_agency/.test(c))?true:{info:calls.join(" | ")}});
  }finally{W.fetch=orig;E(`SBS=null;AG=null`)}
}
