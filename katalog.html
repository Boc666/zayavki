<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Каталог</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--bg:#f7f4ef;--card:#fff;--line:#e7e1d6;--text:#241f1a;--text2:#6b645a;--gold:#b08a4f;--gold-hi:#caa468}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}
header{text-align:center;padding:30px 16px 18px}
.plate{width:64px;height:64px;border-radius:16px;margin:0 auto 12px;background:linear-gradient(160deg,#efe7d8,#e4d8c2);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.plate img{width:54px;height:54px;object-fit:contain}
h1{font-family:Georgia,"Times New Roman",serif;font-size:26px;font-weight:600;margin:0}
.sub{color:var(--text2);font-size:14px;margin-top:4px}
.intro{color:var(--text2);max-width:560px;margin:14px auto 0;font-size:15px}
.sec{margin-top:30px}
.sec h2{font-family:Georgia,serif;font-size:21px;font-weight:600;margin:0 0 4px;padding-bottom:8px;border-bottom:2px solid var(--line);position:relative}
.sec h2::after{content:"";position:absolute;left:0;bottom:-2px;width:54px;height:2px;background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:16px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.ph{aspect-ratio:1/1;background:#efe9df center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#b7ad9c;font-size:12px}
.b{padding:11px 13px}
.b .nm{font-weight:600;font-size:15px;line-height:1.3}
.b .pr{color:var(--gold);font-weight:700;margin-top:3px}
.b .ds{color:var(--text2);font-size:12.5px;margin-top:5px}
.call{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:10;background:linear-gradient(160deg,var(--gold-hi),var(--gold));color:#2a2008;font-weight:700;text-decoration:none;padding:13px 26px;border-radius:999px;box-shadow:0 10px 30px rgba(176,138,79,.4);display:inline-flex;align-items:center;gap:8px}
.msg{text-align:center;color:var(--text2);padding:70px 20px}
.msg h1{color:var(--text);margin-bottom:8px}
footer{text-align:center;color:#a79e8f;font-size:12px;margin-top:40px}
footer a{color:#a79e8f}
.skel{opacity:.5}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="msg skel"><p>Зареждане…</p></div>
</div>

<script>
const SB={url:"https://tdgsyvqfpebexycjnwal.supabase.co",key:"sb_publishable_pEzUKVrv1P-ysyaBBC5KZA_LoDmnEkU"};
try{const t=JSON.parse(localStorage.getItem("zayavki-sb-test")||"null");if(t&&t.url&&t.key){SB.url=t.url;SB.key=t.key}}catch(e){}
const $=s=>document.querySelector(s);
const cssUrl=u=>String(u==null?"":u).replace(/['()\\\s]/g,c=>"%"+c.charCodeAt(0).toString(16).toUpperCase().padStart(2,"0")); // адрес в url('…') без кавички/скоби
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const code=(new URLSearchParams(location.search).get("a")||"").toLowerCase().trim();
const imgUrl=p=>p?(p.indexOf("http")===0?p:SB.url+"/storage/v1/object/public/showcase/"+p):"";
async function rpc(fn,args){
  const r=await fetch(SB.url+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SB.key,Authorization:"Bearer "+SB.key,"Content-Type":"application/json"},body:JSON.stringify(args)});
  if(!r.ok)throw new Error("Грешка "+r.status);
  return r.json();
}
function msg(title,text){$("#root").innerHTML=`<div class="msg"><h1>${esc(title)}</h1><p>${esc(text||"")}</p></div>`}
function telHref(p){const n=(p||"").replace(/[^\d+]/g,"");return n?"tel:"+n:""}

(async()=>{
  if(!/^[a-z0-9-]{2,30}$/.test(code)){msg("Каталог","Линкът е непълен.");return}
  let d;try{d=await rpc("public_showcase",{p_code:code})}catch(e){msg("Няма връзка","Опитайте пак след малко.");return}
  if(!d||d.error){msg("Каталогът не е намерен","Проверете линка или QR кода.");return}
  if(d.off){msg((d.agency&&d.agency.name)||"Каталог","Каталогът не е наличен в момента.");return}
  const ag=d.agency||{}, sc=d.showcase||{};
  const logo=ag.logo&&ag.logo.indexOf("data:")===0?ag.logo:"";
  document.title=(ag.name||"Каталог");
  let html=`<header>
    ${logo?`<div class="plate"><img src="${esc(logo)}" alt=""></div>`:""}
    <h1>${esc(ag.name||"Каталог")}</h1>
    <div class="sub">Каталог за клиенти</div>
    ${sc.intro?`<p class="intro">${esc(sc.intro)}</p>`:""}
  </header>`;
  const secs=(sc.sections||[]).filter(s=>s.items&&s.items.length);
  if(!secs.length){html+=`<div class="msg"><p>Каталогът още се подготвя.</p></div>`}
  secs.forEach(s=>{
    html+=`<div class="sec"><h2>${esc(s.title||"")}</h2><div class="grid">`+
      s.items.map(it=>`<div class="item">
        <div class="ph" ${it.img?`style="background-image:url('${esc(cssUrl(imgUrl(it.img)))}')"`:""}>${it.img?"":"снимка"}</div>
        <div class="b"><div class="nm">${esc(it.name||"")}</div>${it.price?`<div class="pr">${esc(it.price)}</div>`:""}${it.desc?`<div class="ds">${esc(it.desc)}</div>`:""}</div>
      </div>`).join("")+`</div></div>`;
  });
  html+=`<footer>Направено с <a href="https://memoriox.eu" target="_blank" rel="noopener">Memoriox</a></footer>`;
  $("#root").innerHTML=html;
  if(ag.gsm){const t=telHref(ag.gsm);if(t){const a=document.createElement("a");a.className="call";a.href=t;a.innerHTML="☎ Обадете се";document.body.appendChild(a)}}
})();
</script>
</body>
</html>
