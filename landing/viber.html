<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Отваряне на Viber</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f5fa;color:#1d1b26;font:16px/1.5 system-ui,sans-serif;padding:16px;box-sizing:border-box}
@media (prefers-color-scheme:dark){body{background:#14131b;color:#ecebf3}}
main{max-width:360px;text-align:center}
a.b{display:inline-block;margin-top:14px;background:#7360f2;color:#fff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:10px}
p{margin:8px 0}
.m{opacity:.7;font-size:14px}
</style>
</head>
<body>
<main>
  <p id="t">Отварям Viber…</p>
  <a class="b" id="go" href="#" hidden>Отвори Viber</a>
  <p class="m" id="h" hidden>Съобщението вече е копирано. Във Viber задръжте в полето за писане и изберете „Постави“.</p>
</main>
<script>
(function(){
  var n=(new URLSearchParams(location.search).get("n")||"").replace(/\D/g,"");
  if(!/^3598\d{8}$|^3599\d{8}$/.test(n)){document.getElementById("t").textContent="Невалиден номер.";return}
  var url="viber://chat?number=%2B"+n,go=document.getElementById("go");
  go.href=url;go.hidden=false;document.getElementById("h").hidden=false;
  document.getElementById("t").textContent="+"+n;
  location.href=url;
})();
</script>
</body>
</html>
